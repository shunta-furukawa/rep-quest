<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REP QUEST — モンスター素材確認</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/app-shell.css"><style>
html,body{height:auto;overflow:auto}body{padding:20px;margin:0;background:#07131f}body:before{display:none}h1{font-size:22px;margin:0 0 12px}p{font-size:12px;color:#b4c5cf}button{color:#ead09a;background:#123044;border:1px solid #aa8d55;padding:10px;margin:4px;min-height:44px}.palette{display:grid;grid-template-columns:90px repeat(9,minmax(95px,1fr));min-width:1070px;gap:5px}.palette>div{border:1px solid #34515b;text-align:center;padding:6px;font-size:10px;min-width:0}.palette img{display:block;width:90px;height:90px;object-fit:contain;object-position:center bottom;margin:auto;image-rendering:pixelated}.palette small{display:block;font-size:9px}.palette-scroll{overflow:auto;margin:15px 0}#mobile{box-sizing:border-box;width:375px;max-width:100%;padding:16px;border:1px solid #b69b68;background:#0b1e2b}#mobile .bestiary{width:100%}#mobile-title{margin:8px 0 12px;font-size:15px}#mode-note{color:#f1d798}section{margin:20px 0}
</style></head><body><h1>REP QUEST · モンスター素材確認</h1><p>9種族 × 6地域＋黄金個体。CSSフィルターと透過画像をそのまま表示しています。</p><div class="palette-scroll"><div class="palette" id="palette"></div></div><section><h2>アプリ共通の図鑑描画</h2><p>下の枠は指定幅から左右16pxずつを引いた実際のコンテンツ幅です。</p><div><button data-width="320">320px</button><button data-width="375">375px</button><button data-width="390">390px</button><button id="toggle">未発見表示に切替</button></div><p id="mode-note">375px · 全63種発見済み</p><div id="mobile"><h2 id="mobile-title">モンスター図鑑 · 63 / 63 種</h2><div class="bestiary" id="dex"></div></div></section><script type="module">
import {BESTIARY,FAMILIES,monster} from './motivation.js';import {renderBestiary} from './bestiary.js';
const grid=document.getElementById('palette');const cell=t=>{const e=document.createElement('div');e.textContent=t;grid.append(e);return e;};cell('地域 / 種族');FAMILIES.forEach(cell);
['森（元の色）','風（緑）','氷霧（淡青）','星屑（紫）','火焔（赤）','暁（橙）','黄金'].forEach((label,i)=>{cell(label);for(const f of FAMILIES){const m=monster(f,i===6?0:i,i===6),e=cell(''),img=document.createElement('img'),name=document.createElement('small');img.src=`/sprites/${f}.webp`;img.style.filter=m.filter;img.alt=m.name;name.textContent=m.name;e.append(img,name);}});
let seen=true,width=375;function render(){renderBestiary(document.getElementById('dex'),seen?Object.fromEntries(BESTIARY.map(m=>[m.id,1])):{});document.getElementById('mode-note').textContent=`${width}px · ${seen?'全63種発見済み':'未発見'}`;document.getElementById('mobile-title').textContent=`モンスター図鑑 · ${seen?63:0} / 63 種`;}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);document.getElementById('mobile').style.width=`${width}px`;render();});document.getElementById('toggle').onclick=e=>{seen=!seen;e.target.textContent=seen?'未発見表示に切替':'発見済み表示に切替';render();};render();
</script></body></html>
